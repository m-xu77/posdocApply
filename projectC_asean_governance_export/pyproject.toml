[project]
name = "projectc_asean_governance_export"
version = "0.1.0"
description = "Does China export its poverty governance model? LLM-based cross-border frame analysis."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Mengnan Xu", email = "mengnanxu2333@gmail.com" }]

dependencies = [
  # Filled in as stages are implemented. Pinned-only-once-stable convention:
  # "anthropic>=0.40",
  # "openai>=1.50",
  # "httpx>=0.27",
  # "pydantic>=2",
  # "pyarrow>=16",
  # "pandas>=2.2",
  # "polars>=1.5",
  # "beautifulsoup4>=4.12",
  # "pymupdf>=1.24",
  # "paddleocr>=2.7",
  # "langdetect>=1.0",
  # "deepl>=1.18",
  # "simhash>=2.1",
  # "scikit-learn>=1.5",
  # "statsmodels>=0.14",
  # "ruptures>=1.1",     # Bai-Perron
  # "krippendorff>=0.6",
  # "papermill>=2.5",
]

[project.optional-dependencies]
dev = [
  # "ruff",
  # "pytest",
  # "ipykernel",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
